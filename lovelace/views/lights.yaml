################################
#  View: Φωτισμός (Освещение)
################################

title: Φωτισμός
path: lights
icon: mdi:lightbulb-outline

cards:

  - type: custom:mushroom-title-card
    title: Φωτισμός
    subtitle: >
      {% set on = states.light | selectattr('state','eq','on') | list | count %}
      {% set total = states.light | list | count %}
      {{ on }} από {{ total }} ενεργά
    card_mod:
      style: |
        ha-card { background: none; box-shadow: none; }

  # Все группы — по комнатам (авто из area)
  - type: custom:mushroom-light-card
    entity: light.living_room
    name: Σαλόνι
    show_brightness_control: true
    show_color_control: true
    show_color_temp_control: true
    card_mod:
      style: |
        ha-card { border-radius: 12px; }

  - type: custom:mushroom-light-card
    entity: light.bedroom
    name: Υπνοδωμάτιο
    show_brightness_control: true
    show_color_temp_control: true
    card_mod:
      style: |
        ha-card { border-radius: 12px; }

  - type: custom:mushroom-light-card
    entity: light.kitchen
    name: Κουζίνα
    show_brightness_control: true
    card_mod:
      style: |
        ha-card { border-radius: 12px; }

  - type: custom:mushroom-light-card
    entity: light.bathroom
    name: Μπάνιο
    show_brightness_control: true
    card_mod:
      style: |
        ha-card { border-radius: 12px; }

  - type: custom:mushroom-light-card
    entity: light.entrance
    name: Είσοδος
    show_brightness_control: true
    card_mod:
      style: |
        ha-card { border-radius: 12px; }

  # Все огни сразу
  - type: custom:mushroom-template-card
    primary: Όλα τα φώτα
    secondary: Ενεργοποίηση / Απενεργοποίηση
    icon: mdi:lightbulb-group-outline
    icon_color: amber
    tap_action:
      action: call-service
      service: light.toggle
      target:
        entity_id: all
    card_mod:
      style: |
        ha-card { border-radius: 12px; }
